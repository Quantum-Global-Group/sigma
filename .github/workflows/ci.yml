name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Some portfolio tests hit Redis (rate-limit metering paths) — provide
      # a real instance to keep them honest. The api tests still mock Redis
      # in conftest, but a few endpoints reach the real client.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 matches the Dockerfile + dev venv; pandas-ta requires >=3.12
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Python tests
        run: |
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
          cd apps/api && PYTHONPATH=. pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: TypeScript check
        run: |
          cd apps/web && npm ci && npm run type-check
