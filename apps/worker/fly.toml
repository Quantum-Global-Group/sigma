# SIGMA Worker — Fly.io deployment
#
# Long-running asyncio service that drives the per-tick trading cycle. No
# public HTTP surface — only outbound calls (Coinbase market data, sigma-api
# via internal hostname, Postgres, Redis).
#
# Single instance only. Two workers would double-place orders.
#
# Provision once:
#   fly launch --copy-config --no-deploy --dockerfile apps/worker/Dockerfile \
#     --org <your-org> --name sigma-worker
#   fly secrets set INTERNAL_SECRET=... DATABASE_URL=... REDIS_URL=... \
#                   COINBASE_API_KEY_NAME=... COINBASE_PRIVATE_KEY=... \
#                   SENTRY_DSN=... HUGGINGFACE_TOKEN=... \
#                   OANDA_API_TOKEN=... OANDA_ACCOUNT_ID=...   # forex (DEPLOY_FOREX.md)
#   # Re-use sigma-pg + Upstash Redis from the api app (set DATABASE_URL/REDIS_URL
#   # to the same private flycast addresses).
# Deploy:
#   fly deploy

app = "sigma-worker-proud-tree-92"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "60s"  # let the current tick finish before stopping

[build]
  dockerfile = "Dockerfile"
  # Build context is the repo root (the Dockerfile COPYs apps/api and apps/worker).
  # Run `fly deploy` from the repo root, not from apps/worker/.

[env]
  ENVIRONMENT = "production"
  # Comma-separated. Forex runs on Fly (OANDA is cloud REST); OPTIONS DO NOT —
  # Moomoo OpenD is a local gateway, so options run on a separate local/VPS
  # worker (see docs/DEPLOY_OPTIONS.md). Add "equity"/"forex" as secrets land.
  WORKER_ASSET_CLASSES = "equity"
  CRYPTO_EXECUTOR = "paper"         # flip to "coinbase" when ready
  EQUITY_EXECUTOR = "alpaca"
  EQUITY_DATA_PROVIDERS = "alpaca,tiingo"
  FOREX_EXECUTOR = "paper"          # flip to "oanda" when ready (see DEPLOY_FOREX.md)
  WORKER_TICK_SECONDS_CRYPTO = "300"
  WORKER_TICK_SECONDS_EQUITY = "900"
  WORKER_TICK_SECONDS_FOREX = "900"
  SENTIMENT_PROVIDER = "finbert"
  ALPACA_PAPER = "true"
  ALPACA_ALLOW_LIVE = "false"
  OANDA_ENVIRONMENT = "practice"    # practice | live
  OANDA_PAPER = "true"
  OANDA_ALLOW_LIVE = "false"
  # Self-evolution background jobs (label/evaluate/train/snapshot) run on the
  # singleton holder. Set false to disable.
  WORKER_SCHEDULER_ENABLED = "true"
  # The worker image copies apps/api to /app/api (CMD runs from /app), so the
  # bundled model artifact lives at /app/api/ml/saved_models — point MODEL_DIR
  # there explicitly. The default "./ml/saved_models" resolves to /app/ml/...
  # (correct for the api image, which COPYs apps/api to /app, but not here).
  MODEL_DIR = "/app/api/ml/saved_models"
  # Secret-bearing vars (DATABASE_URL, REDIS_URL, INTERNAL_SECRET, COINBASE_*,
  # ALPACA_API_KEY, ALPACA_SECRET) come from `fly secrets`.

# CRITICAL: single instance only. Two workers race on positions + orders.
[deploy]
  strategy = "immediate"  # no rolling deploy — stop old, start new

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  # Worker runs continuously; no auto-stop. Bump to 2gb if torch/transformers
  # memory pressure shows up (FinBERT alone is ~440MB resident).
