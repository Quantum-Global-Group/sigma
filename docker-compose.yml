services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: sigma-postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sigma
      NO_TS_TUNE: "true"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sigma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigma-redis-1
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: sigma-worker-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/sigma
      REDIS_URL: redis://redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      WORKER_ASSET_CLASSES: ${WORKER_ASSET_CLASSES:-crypto}
      EXECUTOR_MODE: ${EXECUTOR_MODE:-paper}
      SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-finbert}
      COINBASE_API_KEY_NAME: ${COINBASE_API_KEY_NAME:-}
      COINBASE_PRIVATE_KEY: ${COINBASE_PRIVATE_KEY:-}
      COINBASE_SANDBOX: ${COINBASE_SANDBOX:-true}
    profiles: ["worker"]
    restart: unless-stopped

volumes:
  postgres_data:
